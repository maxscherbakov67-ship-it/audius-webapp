<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подключение кошелька</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
        }
        .btn {
            background: var(--tg-theme-button-color, #3390ec);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            margin: 20px 0;
            width: 100%;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .status {
            margin: 20px 0;
            padding: 15px;
            border-radius: 8px;
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
        }
        .success {
            color: #4caf50;
        }
        .error {
            color: #f44336;
        }
    </style>
</head>
<body>
    <h1>🔗 Подключение кошелька</h1>
    <p>Нажмите кнопку ниже, чтобы подключить ваш MetaMask кошелек</p>
    
    <button class="btn" id="connectBtn">Подключить MetaMask</button>
    
    <div id="status" class="status" style="display: none;"></div>

    <script>
        // Инициализация Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const connectBtn = document.getElementById('connectBtn');
        const statusDiv = document.getElementById('status');

        function showStatus(message, isError = false) {
            statusDiv.style.display = 'block';
            statusDiv.textContent = message;
            statusDiv.className = isError ? 'status error' : 'status success';
        }

        connectBtn.addEventListener('click', async () => {
            try {
                // Проверяем, есть ли MetaMask
                if (typeof window.ethereum === 'undefined') {
                    showStatus('❌ MetaMask не установлен. Установите расширение MetaMask.', true);
                    return;
                }

                // Запрашиваем подключение
                const accounts = await window.ethereum.request({ 
                    method: 'eth_requestAccounts' 
                });
                
                if (accounts.length === 0) {
                    showStatus('❌ Подключение отменено', true);
                    return;
                }

                const walletAddress = accounts[0];
                showStatus(`✅ Кошелек подключен: ${walletAddress.slice(0, 6)}...${walletAddress.slice(-4)}`);

                // Генерируем сообщение для подписи
                const messageToSign = `Подтвердите подключение к Audius Bot\n\nАдрес: ${walletAddress}\nВремя: ${new Date().toISOString()}`;

                // Запрашиваем подпись
                const signature = await window.ethereum.request({
                    method: 'personal_sign',
                    params: [messageToSign, walletAddress]
                });

                showStatus('✅ Подпись получена! Отправляем данные боту...');

                // Отправляем данные обратно в бот
                tg.sendData(JSON.stringify({
                    wallet_address: walletAddress,
                    signature: signature,
                    message: messageToSign
                }));

                // Закрываем Web App через 2 секунды
                setTimeout(() => {
                    tg.close();
                }, 2000);

            } catch (error) {
                console.error('Ошибка:', error);
                showStatus(`❌ Ошибка: ${error.message}`, true);
            }
        });
    </script>
</body>
</html>
